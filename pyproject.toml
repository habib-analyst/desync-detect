[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "desync-detect"
version = "0.1.0"
description = "Audio-video desynchronization detector: fast CPU-only triage signal for A/V lip-sync drift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Habib Ur Rehman" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
]

[project.scripts]
desync-detect = "desyncdetect.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["desyncdetect*"]
